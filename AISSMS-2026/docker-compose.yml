version: "3.9"
services:
  fastapi_app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  celery_worker:
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on:
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  whisper_service:
    image: ghcr.io/ggerganov/whisper.cpp:latest
    ports:
      - "9000:9000"
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    depends_on:
      - fastapi_app
volumes:
  pgdata:
